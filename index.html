<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelayGuard Protocol — Flight Insurance</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { font-size: 1.8rem; color: #00d4aa; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
        .card { background: #151520; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.1rem; color: #00d4aa; margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.3rem; margin-top: 0.8rem; }
        input, select { width: 100%; padding: 0.75rem; background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 8px; color: #e0e0e0; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #00d4aa; }
        button { width: 100%; padding: 0.9rem; background: #00d4aa; color: #0a0a0f; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: all 0.2s; }
        button:hover:not(:disabled) { background: #00b894; transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .status { padding: 0.75rem; background: #0a0a0f; border-radius: 8px; margin-top: 0.8rem; font-size: 0.85rem; word-break: break-all; display: none; }
        .status.success { color: #00d4aa; border: 1px solid #00d4aa33; display: block; }
        .status.error { color: #ff6b6b; border: 1px solid #ff6b6b33; display: block; }
        .status.pending { color: #ffd93d; border: 1px solid #ffd93d33; display: block; }
        .info-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid #1a1a2a; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; font-size: 0.85rem; }
        .info-value { color: #e0e0e0; font-size: 0.85rem; font-weight: 500; }
        .pill { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .pill.researching { background: #ffd93d33; color: #ffd93d; }
        .pill.resolved { background: #00d4aa33; color: #00d4aa; }
        .pill.payout { background: #00d4aa33; color: #00d4aa; }
        .pill.refund { background: #ff6b6b33; color: #ff6b6b; }
        .pill.delayed { background: #ff6b6b33; color: #ff6b6b; }
        .pill.ontime { background: #00d4aa33; color: #00d4aa; }
        #wallet-info { display: none; }
        .wallet-connected #wallet-info { display: block; }
        .wallet-connected #connect-btn { display: none; }
        .transfer-item { padding: 0.5rem; background: #0a0a0f; border-radius: 8px; margin-bottom: 0.5rem; }
        a { color: #00d4aa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .loading { display: inline-block; width: 12px; height: 12px; border: 2px solid #ffd93d33; border-top-color: #ffd93d; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 1rem; color: #666; font-size: 0.85rem; }
        .network-badge { display: inline-block; padding: 0.2rem 0.5rem; background: #00d4aa22; color: #00d4aa; border-radius: 6px; font-size: 0.7rem; margin-left: 0.5rem; }
        @media (max-width: 480px) {
            .container { padding: 1rem 0.5rem; }
            h1 { font-size: 1.4rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DelayGuard Protocol</h1>
        <p class="subtitle">Flight Insurance on GenLayer Bradbury Testnet <span class="network-badge">BRADBURY</span></p>

        <div class="card">
            <h2>Wallet</h2>
            <button id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
            <div id="wallet-info">
                <div class="info-row">
                    <span class="info-label">Address</span>
                    <span class="info-value" id="wallet-address">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Balance</span>
                    <span class="info-value" id="wallet-balance">—</span>
                </div>
                <button onclick="disconnectWallet()" style="margin-top:0.8rem; background:#ff6b6b; color:white;">Disconnect</button>
            </div>
        </div>

        <div class="card">
            <h2>Purchase Policy</h2>
            <label>Flight Number</label>
            <input id="flight-number" placeholder="e.g. BA173" value="BA173">

            <label>Flight Date</label>
            <input id="flight-date" type="date" placeholder="2026-09-15" value="2026-09-15">

            <label>Coverage Amount (GEN)</label>
            <input id="coverage-amount" type="number" placeholder="0.005" value="0.005" step="0.001" min="0.001">

            <label>Claimant Address (optional, defaults to you)</label>
            <input id="claimant-address" placeholder="0x...">

            <button id="purchase-btn" onclick="purchasePolicy()" disabled>Purchase Policy</button>
            <div id="purchase-status" class="status"></div>
        </div>

        <div class="card">
            <h2>My Policies</h2>
            <button onclick="loadPolicies()" style="margin-top:0;">Refresh</button>
            <div id="policies-list"><div class="empty-state">Connect wallet to view policies</div></div>
        </div>

        <div class="card">
            <h2>Evaluate Policy (Trigger Payout/Refund)</h2>
            <label>Policy ID</label>
            <input id="eval-policy-id" type="number" placeholder="0" value="0" min="0">

            <label>Flight Status</label>
            <select id="eval-status">
                <option value="DELAYED">DELAYED (>= 30 min delay → payout to claimant)</option>
                <option value="ON_TIME">ON_TIME (refund to depositor)</option>
            </select>

            <label>Delay Minutes</label>
            <input id="eval-delay" type="number" placeholder="75" value="75" min="0">

            <button id="eval-btn" onclick="evaluatePolicy()" disabled>Evaluate</button>
            <div id="eval-status" class="status"></div>
        </div>

        <div class="card">
            <h2>Transfer History</h2>
            <button onclick="loadTransfers()" style="margin-top:0;">Refresh</button>
            <div id="transfers-list"><div class="empty-state">Connect wallet to view transfers</div></div>
        </div>
    </div>

    <script>
    const CONTRACT = '0x318CBF3Ad6B0c57F6BFCA096C9b55665e08cb883';
    const EXPLORER = 'https://explorer-bradbury.genlayer.com';
    const CHAIN_ID = '0x107d';
    const EXPECTED_CHAIN_ID = '0x107d';
    const RPC_URL = 'https://rpc-bradbury.genlayer.com';

    // Contract ABI
    const ABI = [
        "function purchasePolicy(string flight_number, string flight_date, string claimant) payable returns (uint256)",
        "function evaluatePolicy(uint256 policy_id, string flight_status, uint256 delay_minutes) returns (string)",
        "function getPolicy(uint256 policy_id) view returns (string)",
        "function getTransferCount() view returns (string)",
        "function getEmittedTransfers() view returns (string)",
        "function getTransfer(string index) view returns (string)"
    ];

    let provider = null;
    let signer = null;
    let contract = null;
    let account = null;
    let isProcessing = false;

    function showStatus(elementId, message, type) {
        const el = document.getElementById(elementId);
        el.className = 'status ' + type;
        el.innerHTML = message;
    }

    function clearStatus(elementId) {
        const el = document.getElementById(elementId);
        el.className = 'status';
        el.innerHTML = '';
    }

    function setProcessing(processing) {
        isProcessing = processing;
        document.getElementById('purchase-btn').disabled = processing || !account;
        document.getElementById('eval-btn').disabled = processing || !account;
    }

    async function connectWallet() {
        if (isProcessing) return;

        try {
            if (!window.ethereum) {
                showStatus('purchase-status', '❌ No wallet detected. Please install MetaMask or a Web3 wallet.', 'error');
                return;
            }

            showStatus('purchase-status', '<span class="loading"></span>Connecting to wallet...', 'pending');

            // Request account access
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            account = accounts[0];

            // Check and switch network
            const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });

            if (currentChainId !== EXPECTED_CHAIN_ID) {
                showStatus('purchase-status', '<span class="loading"></span>Switching to Bradbury testnet...', 'pending');

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: EXPECTED_CHAIN_ID }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902 || switchError.data?.originalError?.code === 4902) {
                        showStatus('purchase-status', '<span class="loading"></span>Adding Bradbury testnet to MetaMask...', 'pending');
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: EXPECTED_CHAIN_ID,
                                chainName: 'GenLayer Bradbury Testnet',
                                rpcUrls: [RPC_URL],
                                nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
                                blockExplorerUrls: [EXPLORER],
                            }],
                        });
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: EXPECTED_CHAIN_ID }],
                        });
                    } else if (switchError.code === 4001) {
                        throw new Error('Network switch rejected by user');
                    } else {
                        throw switchError;
                    }
                }
            }

            // Confirm final network
            const finalChainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (finalChainId !== EXPECTED_CHAIN_ID) {
                throw new Error('Failed to switch to Bradbury testnet');
            }

            // Setup ethers provider and contract
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT, ABI, signer);

            // Update UI
            document.getElementById('wallet-address').textContent = account.slice(0, 6) + '...' + account.slice(-4);
            document.getElementById('wallet-info').style.display = 'block';
            document.getElementById('connect-btn').style.display = 'none';
            document.getElementById('purchase-btn').disabled = false;
            document.getElementById('eval-btn').disabled = false;

            // Get balance
            const balance = await provider.getBalance(account);
            document.getElementById('wallet-balance').textContent = parseFloat(ethers.formatEther(balance)).toFixed(4) + ' GEN';

            clearStatus('purchase-status');

            // Load data
            await loadPolicies();
            await loadTransfers();

            // Listen for changes
            window.ethereum.on('accountsChanged', handleAccountsChanged);
            window.ethereum.on('chainChanged', () => window.location.reload());

        } catch (e) {
            console.error(e);
            if (e.code === 4001) {
                showStatus('purchase-status', '❌ Connection rejected by user', 'error');
            } else {
                showStatus('purchase-status', '❌ Connection failed: ' + e.message, 'error');
            }
        }
    }

    function handleAccountsChanged(accounts) {
        if (accounts.length === 0) {
            disconnectWallet();
        } else if (accounts[0] !== account) {
            account = accounts[0];
            document.getElementById('wallet-address').textContent = account.slice(0, 6) + '...' + account.slice(-4);
            loadPolicies();
            loadTransfers();
        }
    }

    function disconnectWallet() {
        account = null;
        provider = null;
        signer = null;
        contract = null;
        document.getElementById('wallet-info').style.display = 'none';
        document.getElementById('connect-btn').style.display = 'block';
        document.getElementById('purchase-btn').disabled = true;
        document.getElementById('eval-btn').disabled = true;
        document.getElementById('policies-list').innerHTML = '<div class="empty-state">Connect wallet to view policies</div>';
        document.getElementById('transfers-list').innerHTML = '<div class="empty-state">Connect wallet to view transfers</div>';
        clearStatus('purchase-status');
        clearStatus('eval-status');

        if (window.ethereum && window.ethereum.removeListener) {
            window.ethereum.removeListener('accountsChanged', handleAccountsChanged);
        }
    }

    async function purchasePolicy() {
        if (!account || isProcessing || !contract) return;

        const flightNumber = document.getElementById('flight-number').value.trim();
        const flightDate = document.getElementById('flight-date').value;
        const amount = document.getElementById('coverage-amount').value;
        const claimant = document.getElementById('claimant-address').value.trim() || account;

        if (!flightNumber) {
            showStatus('purchase-status', '❌ Flight number is required', 'error');
            return;
        }
        if (!flightDate) {
            showStatus('purchase-status', '❌ Flight date is required', 'error');
            return;
        }
        if (!amount || parseFloat(amount) <= 0) {
            showStatus('purchase-status', '❌ Coverage amount must be greater than 0', 'error');
            return;
        }

        try {
            setProcessing(true);
            showStatus('purchase-status', '<span class="loading"></span>Submitting transaction...', 'pending');

            const tx = await contract.purchasePolicy(flightNumber, flightDate, claimant, {
                value: ethers.parseEther(amount)
            });

            showStatus('purchase-status', `<span class="loading"></span>Waiting for consensus...<br>Tx: <a href="${EXPLORER}/tx/${tx.hash}" target="_blank">${tx.hash.slice(0, 10)}...</a>`, 'pending');

            const receipt = await tx.wait();

            if (receipt && receipt.status === 1) {
                showStatus('purchase-status', `✅ Policy purchased! <a href="${EXPLORER}/tx/${tx.hash}" target="_blank">View on Explorer</a>`, 'success');
                document.getElementById('flight-number').value = '';
                document.getElementById('claimant-address').value = '';
                await loadPolicies();
                await loadTransfers();
                await updateBalance();
            } else {
                showStatus('purchase-status', '❌ Transaction reverted by contract', 'error');
            }
        } catch (e) {
            console.error(e);
            if (e.code === 4001 || e.code === 'ACTION_REJECTED') {
                showStatus('purchase-status', '❌ Transaction rejected by user', 'error');
            } else {
                showStatus('purchase-status', '❌ Error: ' + (e.reason || e.message), 'error');
            }
        } finally {
            setProcessing(false);
        }
    }

    async function evaluatePolicy() {
        if (!account || isProcessing || !contract) return;

        const policyId = parseInt(document.getElementById('eval-policy-id').value);
        const flightStatus = document.getElementById('eval-status').value;
        const delayMinutes = parseInt(document.getElementById('eval-delay').value);

        if (isNaN(policyId) || policyId < 0) {
            showStatus('eval-status', '❌ Invalid policy ID', 'error');
            return;
        }
        if (isNaN(delayMinutes) || delayMinutes < 0) {
            showStatus('eval-status', '❌ Delay minutes must be >= 0', 'error');
            return;
        }

        try {
            setProcessing(true);
            showStatus('eval-status', '<span class="loading"></span>Submitting transaction...', 'pending');

            const tx = await contract.evaluatePolicy(policyId, flightStatus, delayMinutes);

            showStatus('eval-status', `<span class="loading"></span>Waiting for consensus...<br>Tx: <a href="${EXPLORER}/tx/${tx.hash}" target="_blank">${tx.hash.slice(0, 10)}...</a>`, 'pending');

            const receipt = await tx.wait();

            if (receipt && receipt.status === 1) {
                const action = flightStatus === 'DELAYED' ? 'Payout' : 'Refund';
                showStatus('eval-status', `✅ Policy evaluated! ${action} triggered. <a href="${EXPLORER}/tx/${tx.hash}" target="_blank">View on Explorer</a>`, 'success');
                await loadPolicies();
                await loadTransfers();
            } else {
                showStatus('eval-status', '❌ Transaction reverted by contract', 'error');
            }
        } catch (e) {
            console.error(e);
            if (e.code === 4001 || e.code === 'ACTION_REJECTED') {
                showStatus('eval-status', '❌ Transaction rejected by user', 'error');
            } else {
                showStatus('eval-status', '❌ Error: ' + (e.reason || e.message), 'error');
            }
        } finally {
            setProcessing(false);
        }
    }

    async function updateBalance() {
        if (!account || !provider) return;
        const balance = await provider.getBalance(account);
        document.getElementById('wallet-balance').textContent = parseFloat(ethers.formatEther(balance)).toFixed(4) + ' GEN';
    }

    async function loadPolicies() {
        if (!account || !contract) return;

        try {
            let html = '';
            let found = false;

            for (let i = 0; i < 50; i++) {
                try {
                    const policyRaw = await contract.getPolicy(i);
                    const policy = JSON.parse(policyRaw);
                    if (policy.exists === false) break;
                    found = true;

                    const statusClass = policy.status.toLowerCase();
                    const verdictClass = policy.verdict ? policy.verdict.toLowerCase().replace('_', '') : '';
                    const amountGen = (parseInt(policy.amount) / 1e18).toFixed(4);

                    html += `
                        <div class="transfer-item">
                            <div class="info-row">
                                <span class="info-label">Policy #${i}</span>
                                <span class="pill ${statusClass}">${policy.status}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">${policy.flight_number} • ${policy.flight_date}</span>
                                <span class="info-value">${amountGen} GEN</span>
                            </div>
                            ${policy.verdict ? `
                            <div class="info-row">
                                <span class="info-label">Verdict</span>
                                <span class="pill ${verdictClass}">${policy.verdict} (${policy.delay_minutes} min)</span>
                            </div>
                            ` : '<div class="info-row"><span class="info-label" style="color:#ffd93d;">⏳ Pending evaluation</span></div>'}
                        </div>
                    `;
                } catch (e) {
                    break;
                }
            }

            document.getElementById('policies-list').innerHTML = found ? html : '<div class="empty-state">No policies found. Purchase one above!</div>';
        } catch (e) {
            console.error(e);
            document.getElementById('policies-list').innerHTML = '<div class="empty-state">Error loading policies</div>';
        }
    }

    async function loadTransfers() {
        if (!account || !contract) return;

        try {
            const transfersRaw = await contract.getEmittedTransfers();
            const transfers = JSON.parse(transfersRaw);

            let html = '';
            let count = 0;

            for (const [key, val] of Object.entries(transfers)) {
                if (key === 'error') continue;
                const t = typeof val === 'string' ? JSON.parse(val) : val;
                const amountGen = (parseInt(t.amount) / 1e18).toFixed(4);
                const typeClass = t.type;
                count++;

                html += `
                    <div class="transfer-item">
                        <div class="info-row">
                            <span class="info-label">Transfer #${key}</span>
                            <span class="pill ${typeClass}">${t.type.toUpperCase()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">${t.flight_number} • ${t.delay_minutes} min</span>
                            <span class="info-value">${amountGen} GEN</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Recipient</span>
                            <span class="info-value">${t.recipient.slice(0, 10)}...</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('transfers-list').innerHTML = count > 0 ? html : '<div class="empty-state">No transfers yet</div>';
        } catch (e) {
            console.error(e);
            document.getElementById('transfers-list').innerHTML = '<div class="empty-state">Error loading transfers</div>';
        }
    }

    // Check if already connected on page load
    window.addEventListener('load', async () => {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    account = accounts[0];
                    document.getElementById('wallet-address').textContent = account.slice(0, 6) + '...' + account.slice(-4);
                    document.getElementById('wallet-info').style.display = 'block';
                    document.getElementById('connect-btn').style.display = 'none';

                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    if (chainId !== EXPECTED_CHAIN_ID) {
                        showStatus('purchase-status', `<span class="loading"></span>Please switch to Bradbury testnet. <button onclick="connectWallet()" style="margin-top:0.5rem;">Switch Network</button>`, 'pending');
                    } else {
                        // Setup contract for read-only operations
                        provider = new ethers.BrowserProvider(window.ethereum);
                        contract = new ethers.Contract(CONTRACT, ABI, provider);
                        
                        document.getElementById('purchase-btn').disabled = false;
                        document.getElementById('eval-btn').disabled = false;

                        const balance = await provider.getBalance(account);
                        document.getElementById('wallet-balance').textContent = parseFloat(ethers.formatEther(balance)).toFixed(4) + ' GEN';

                        await loadPolicies();
                        await loadTransfers();
                    }

                    window.ethereum.on('accountsChanged', handleAccountsChanged);
                    window.ethereum.on('chainChanged', () => window.location.reload());
                }
            } catch (e) {
                console.error(e);
            }
        }
    });
    </script>
</body>
</html>
